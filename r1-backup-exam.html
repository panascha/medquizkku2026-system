<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MedQuiz KKU 2026 — R1 Backup Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/r1-backup-exam.css">
</head>
<body>
    <div id="fixtureBanner" class="banner banner-test" hidden>โหมดทดสอบ — ข้อมูลจำลอง</div>
    <div id="fsBanner" class="banner banner-warn" hidden>
        ออกจากโหมดเต็มจอแล้ว
        <button type="button" id="fsReenter" class="btn btn-sm">เข้าเต็มจออีกครั้ง</button>
    </div>

    <!-- Screen: seat entry -->
    <main id="screenSeat" class="screen" hidden>
        <form id="seatForm" class="card" autocomplete="off" novalidate>
            <h1>ข้อสอบสำรอง Round 1</h1>
            <label for="seatInput">รหัสที่นั่ง (Username)</label>
            <input id="seatInput" type="text" placeholder="mq2026-001-1" spellcheck="false" autocapitalize="off">
            <p id="seatError" class="error" role="alert" hidden></p>
            <button type="submit" id="seatNext" class="btn btn-primary">ถัดไป</button>
        </form>
    </main>

    <!-- Screen: confirm seat -->
    <main id="screenConfirm" class="screen" hidden>
        <div class="card">
            <h1 id="confirmText"></h1>
            <p class="muted">การยืนยันจะผูกที่นั่งนี้กับอุปกรณ์นี้ ไม่สามารถเปลี่ยนเองได้</p>
            <p id="confirmError" class="error" role="alert" hidden></p>
            <div class="row">
                <button type="button" id="confirmNo" class="btn">ไม่ใช่</button>
                <button type="button" id="confirmYes" class="btn btn-primary">ใช่</button>
            </div>
        </div>
    </main>

    <!-- Screen: waiting -->
    <main id="screenWait" class="screen" hidden>
        <div class="card">
            <h1 id="waitSeat"></h1>
            <p id="waitText" class="muted"></p>
            <p id="waitClock" class="big-clock">--:--</p>
            <p id="waitParts" class="muted"></p>
            <p id="waitError" class="error" role="alert" hidden></p>
        </div>
    </main>

    <!-- Screen: exam -->
    <div id="screenExam" class="exam" hidden>
        <header class="topbar">
            <span id="hdrSeat" class="seat"></span>
            <nav class="tabs" role="tablist">
                <button type="button" id="tabMcq" class="tab" role="tab">Part 1</button>
                <button type="button" id="tabUnseen" class="tab" role="tab">Part 2</button>
            </nav>
            <span id="hdrClock" class="clock" aria-live="off">--:--</span>
            <span id="hdrBlur" class="chip" hidden></span>
            <span id="hdrSync" class="chip" title="สถานะการบันทึก"></span>
            <button type="button" id="themeToggle" class="btn btn-sm" aria-label="สลับธีม">ธีม</button>
            <button type="button" id="navToggle" class="btn btn-sm" aria-expanded="true">ข้อ</button>
        </header>
        <div class="body">
            <section id="canvas" class="canvas" tabindex="-1"></section>
            <aside id="navPanel" class="navpanel">
                <div id="navGrid" class="navgrid"></div>
                <p class="legend muted">
                    <span class="dot s-answered"></span>ตอบแล้ว
                    <span class="dot s-partial"></span>ตอบบางส่วน
                    <span class="dot s-unanswered"></span>ยังไม่ตอบ
                    <span class="dot flag"></span>ติดธง
                </p>
            </aside>
        </div>
        <footer class="bottombar">
            <button type="button" id="btnPrev" class="btn">ก่อนหน้า</button>
            <button type="button" id="btnFlag" class="btn">ติดธง (M)</button>
            <button type="button" id="btnNext" class="btn">ถัดไป</button>
            <span class="spacer"></span>
            <button type="button" id="btnSubmit" class="btn btn-primary">ส่งข้อสอบ</button>
        </footer>
    </div>

    <!-- Submit modal (2-step) -->
    <div id="modal" class="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 id="modalTitle"></h2>
            <p id="modalBody"></p>
            <div class="row">
                <button type="button" id="modalCancel" class="btn">ยกเลิก</button>
                <button type="button" id="modalOk" class="btn btn-primary"></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/r1-backup-app.js"></script>
</body>
</html>
