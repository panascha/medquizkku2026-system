<!-- Staff-only: All-staff live event monitor — room pulse, schedule drift, escort roster (event day 1 Nov 2569). -->
<!-- Guarded by Firebase Google sign-in + js/staff-guard.js (KKU domain + staff_whitelist). -->
<!-- Data: OnSite GAS Web App action=getAllOnSiteTeams (server re-checks the ID token + whitelist). -->
<!-- Base rotation is driven by the rotation start IT stamps from the Sheet menu -->
<!-- ("⏱️ เริ่มหมุนฐาน"), not fixed wall-clock times, so a late Round 1 cannot show wrong stations. -->
<!-- Awards view: action=getAwardSummary (closing ceremony, read-only), fetched only while that view is open. -->
<!-- No localStorage copy of the roster (PDPA): only the slot override, open view and award-checklist ids/ticks. -->

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ติดตามวันงาน — MedQuiz KKU 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Egyptian MedQuiz palette — high contrast for outdoor sun + dim hall. */
        :root {
            --navy: #0B132B; --navy2: #0F1F4B; --card: #152A5E; --line: #2C4580;
            --gold1: #F5D77A; --gold2: #E4B43C; --text: #F8FAFC; --muted: #C3CEE6;
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--navy); color: var(--text); }
        .panel { background: var(--navy2); border: 1px solid var(--line); }
        .card { background: var(--card); border: 1px solid var(--line); }
        .muted { color: var(--muted); }
        .gold { color: var(--gold1); }
        .gold-bg { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: var(--navy); }
        .tab-active { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: var(--navy); border-color: var(--gold2); }
        .room-active { outline: 3px solid var(--gold1); outline-offset: -1px; }
        .badge-A { background: #10B981; color: var(--navy); }
        .badge-B { background: #F59E0B; color: var(--navy); }
        .badge-C { background: #0D9488; color: var(--navy); }
        .badge-spot { background: #2563EB; color: #fff; }
        .badge-gs { background: #7C3AED; color: #fff; }
        .dot { display: inline-block; width: .65rem; height: .65rem; border-radius: 9999px; vertical-align: middle; }
        /* Award ceremony view */
        .award-done { opacity: .45; }
    </style>
</head>

<body class="min-h-screen">

    <!-- Loading / auth gate -->
    <div id="gate" class="min-h-screen flex items-center justify-center p-6 text-center">
        <div>
            <i class="fa-solid fa-circle-notch fa-spin text-3xl gold"></i>
            <p id="gateMsg" class="mt-3 muted">กำลังตรวจสอบสิทธิ์ Staff…</p>
        </div>
    </div>

    <div id="app" class="hidden max-w-3xl mx-auto pb-16">
        <!-- Header -->
        <header class="sticky top-0 z-20 text-white px-4 pt-3 pb-3 shadow-lg" style="background: var(--navy2); border-bottom: 3px solid var(--gold2);">
            <div class="flex items-center justify-between gap-2">
                <div class="min-w-0">
                    <h1 class="font-bold text-lg leading-tight gold">ติดตามวันงาน MedQuiz KKU 2026</h1>
                    <p id="userEmail" class="text-xs muted truncate"></p>
                </div>
                <div class="text-right shrink-0">
                    <div id="clock" class="font-mono text-xl font-bold tabular-nums">--:--:--</div>
                    <button id="logoutBtn" class="text-xs muted underline">ออกจากระบบ</button>
                </div>
            </div>
            <div class="mt-2 flex items-center justify-between gap-2 text-xs">
                <span id="lastUpdated" class="muted">ยังไม่ได้โหลดข้อมูล</span>
                <button id="syncBtn" class="gold-bg rounded-full px-3 py-1 font-semibold">
                    <i id="syncIcon" class="fa-solid fa-rotate"></i> ซิงค์
                </button>
            </div>
        </header>

        <!-- View switcher: live status vs closing-ceremony awards -->
        <nav id="viewNav" class="mx-4 mt-3 grid grid-cols-2 gap-2 text-sm">
            <button data-view="status" class="rounded-lg panel px-2 py-2 font-semibold">📋 สถานะทีม &amp; ฐานกิจกรรม</button>
            <button data-view="awards" class="rounded-lg panel px-2 py-2 font-semibold">🏆 สรุปรางวัลพิธีปิด (17:00) <span id="awardBadge" class="hidden dot bg-emerald-400"></span></button>
        </nav>

        <!-- Connection error (keeps showing last data from this session) -->
        <div id="errorBox" class="hidden mx-4 mt-3 rounded-lg border border-amber-300 bg-amber-50 text-amber-900 px-3 py-2 text-sm"></div>

        <div id="statusView">
        <!-- Schedule drift vs master timeline (event day + IT stamp only) -->
        <div id="driftBanner" class="hidden mx-4 mt-3 rounded-xl px-4 py-3 bg-amber-400 text-slate-950 font-semibold"></div>

        <!-- Phase banner -->
        <section id="phaseBanner" class="mx-4 mt-3 rounded-xl px-4 py-3 border"></section>

        <!-- Live Building & Room Pulse (tap a room to filter the roster) -->
        <section class="mx-4 mt-3 rounded-xl panel px-4 py-3">
            <h2 class="font-bold gold"><i class="fa-solid fa-building"></i> สถานะห้อง / อาคาร</h2>
            <div id="roomPulse" class="mt-2 grid grid-cols-2 gap-2 text-sm"></div>
        </section>

        <!-- Base rotation panel (phase 1 only) -->
        <section id="rotationPanel" class="hidden mx-4 mt-3 rounded-xl panel px-4 py-3">
            <div class="flex items-center justify-between gap-2">
                <h2 class="font-bold gold"><i class="fa-solid fa-route"></i> การเดินฐาน (60 ทีม)</h2>
                <select id="slotSelect" class="text-sm rounded-md px-2 py-1 card text-white">
                    <option value="auto">อัตโนมัติ (ตามเวลาเริ่มจาก IT)</option>
                    <option value="0">บังคับ: รอบที่ 1</option>
                    <option value="1">บังคับ: รอบที่ 2</option>
                    <option value="2">บังคับ: รอบที่ 3</option>
                </select>
            </div>
            <p id="rotationStatus" class="mt-1 text-sm muted"></p>
            <div id="rotationGrid" class="mt-2 grid grid-cols-3 gap-2 text-center text-sm"></div>
        </section>

        <!-- Counts -->
        <section id="countsBar" class="mx-4 mt-3 grid grid-cols-4 gap-2 text-center text-xs"></section>

        <!-- Spot Test signature sheet export (built in memory from the last fetch; nothing stored) -->
        <section class="mx-4 mt-3 rounded-xl panel px-4 py-3">
            <h2 class="font-bold gold"><i class="fa-solid fa-file-signature"></i> ใบเซ็นชื่อรอบ Spot Test</h2>
            <p id="signSheetNote" class="mt-1 text-xs muted">รอโหลดข้อมูล…</p>
            <select id="signSheetScope" class="hidden mt-2 w-full text-sm rounded-md px-2 py-1 card text-white">
                <option value="first40">ร่างก่อนประกาศผลรอบ 1: ทีมแรก 40 ทีม (เรียงตามรหัส MQ)</option>
                <option value="all">ร่างก่อนประกาศผลรอบ 1: ทุกทีม</option>
            </select>
            <div class="mt-2 grid grid-cols-2 gap-2 text-sm">
                <button id="signPrintBtn" class="gold-bg rounded-lg px-2 py-2 font-bold" disabled>🖨️ พิมพ์ / PDF</button>
                <button id="signDocBtn" class="rounded-lg card px-2 py-2 font-semibold" disabled>📄 Word (.doc)</button>
            </div>
        </section>

        <!-- Tabs + search -->
        <nav id="tabs" class="mx-4 mt-3 flex gap-2 overflow-x-auto pb-1 text-sm"></nav>
        <div class="mx-4 mt-2 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 muted"></i>
            <input id="search" type="search" autocomplete="off"
                placeholder="ค้นหา รหัสทีม / ชื่อทีม / ชื่อนักเรียน"
                class="w-full rounded-lg card text-white placeholder-slate-400 pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-300">
        </div>
        <p id="listNote" class="mx-4 mt-2 text-xs muted"></p>

        <!-- Team cards -->
        <main id="cards" class="mx-4 mt-2 space-y-2"></main>
        </div>

        <!-- Closing ceremony award summary (loaded only while this view is open) -->
        <div id="awardsView" class="hidden">
            <section class="mx-4 mt-3 rounded-xl panel px-4 py-3 space-y-2">
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <button data-order="call" class="rounded-lg card px-2 py-2 font-semibold">🎤 ลำดับขึ้นเวที</button>
                    <button data-order="rank" class="rounded-lg card px-2 py-2 font-semibold">🔢 เรียงตามอันดับ</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <button id="copyScriptBtn" class="gold-bg rounded-lg px-2 py-2 font-bold">📋 คัดลอกบทประกาศพิธีกร</button>
                    <button id="resetChecksBtn" class="rounded-lg card px-2 py-2 font-semibold">↺ ล้างเช็กลิสต์เครื่องนี้</button>
                </div>
                <p id="awardMeta" class="text-xs muted"></p>
            </section>
            <div id="awardBanners"></div>
            <div id="awardList" class="mx-4 mt-3 space-y-2"></div>
        </div>
    </div>

    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { requireStaff } from "./js/staff-guard.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Same OnSite Web App deployment as check-onsite.html (redeploy in place: clasp deploy -i).
        const API_URL = "https://script.google.com/macros/s/AKfycbxqyrFCMHgwna03zGskM2d7xrk9kNQu8L71VU4gbAfBfwr7aJy0uLF2JIQ3lq4TXNZIGw/exec";
        const REFRESH_MS = 60000;      // ≥ GAS row cache (45 s); jitter spreads staff phones
        const REFRESH_JITTER_MS = 15000;

        // Base rotation: 3 slots × 35 min, 5 min changeover. Group g at slot s is at
        // BASES[(g + s) % 3] → A: Gross→Para→Skill, B: Para→Skill→Gross, C: Skill→Gross→Para.
        const SLOT_MIN = 35, GAP_MIN = 5, SLOTS = 3;
        const BASES = ["Gross Anatomy", "Parasitology", "Skill Lab"];
        const GROUPS = ["A", "B", "C"];

        // Room / schedule wording — edit here if the action plan changes.
        const TEXT = {
            r1Room: "ห้องสอบคอมพิวเตอร์ (แข่งขันรอบที่ 1)",
            spotRoom: "ห้องปฏิบัติการ 8 (สอบ Spot Test)",
            rotationDone: "จบเดินฐาน — พักรับประทานอาหารกลางวัน (รอประกาศผลรอบ 2 เวลา 13:00 น.)",
            gameshowFinalist: "ห้องประชุมมอดินแดง (เตรียมแข่ง Game Show 14:00–17:00)",
            spotEliminated: "ผู้ชม Game Show / ติดต่อรับเกียรติบัตร",
            activityAfter: "เข้าร่วม MED Talk (13:20–13:50) → ผู้ชม Game Show / รับเกียรติบัตร",
            lab8Room: "ห้องปฏิบัติการ 8",
            audRoom: "ห้องประชุมมอดินแดง",
        };
        const BASE_FLOORS = ["ชั้น 3", "ชั้น 4", "ชั้น 4"];   // aligned with BASES (staff spec)
        // Auditorium plan (Bangkok HH:mm, wall clock): MED Talk then Game Show.
        const AUD_PLAN = [
            { from: "13:20", to: "13:50", label: "MED Talk" },
            { from: "14:00", to: "17:00", label: "Game Show", needsR2: true },   // can't start before R2 results
        ];

        // Drift banner: IT rotation stamp vs master timeline (R2 SPOT 10:50). Shown only on
        // the event day so rehearsal stamps never trigger it, and only when late > threshold.
        const DRIFT = { eventDate: "2026-11-01", plannedStart: "10:50", thresholdMin: 5 };

        const $ = id => document.getElementById(id);
        let data = null;          // last successful payload (memory only)
        let fetchedAt = 0;        // Date.now() when data arrived
        let serverOffset = 0;     // serverNowMs − phone clock
        let tab = "all";
        let query = "";
        let loading = false;
        let lastRotationKey = "";
        let started = false;
        let view = (() => { try { return localStorage.getItem("onsiteStaffView") === "awards" ? "awards" : "status"; } catch { return "status"; } })();

        const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function loadSlotOverride() {
            try { return localStorage.getItem("onsiteStaffSlot") || "auto"; } catch { return "auto"; }
        }
        function saveSlotOverride(v) {
            try { localStorage.setItem("onsiteStaffSlot", v); } catch { /* private mode */ }
        }
        let slotOverride = loadSlotOverride();

        // ── Auth ────────────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!(await requireStaff(user))) return;
            $("userEmail").textContent = user.email;
            $("gate").classList.add("hidden");
            $("app").classList.remove("hidden");
            if (!started) { started = true; setView(view); scheduleRefresh(); }
        });
        $("logoutBtn").onclick = () => signOut(auth).then(() => location.replace("pages/login.html"));

        // ── Fetch ───────────────────────────────────────────────────────────
        async function callApi(action = "getAllOnSiteTeams") {
            const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : "";
            const res = await fetch(`${API_URL}?action=${action}&idToken=${encodeURIComponent(idToken)}`);
            const json = await res.json();   // GAS error pages are HTML → throws → retried
            if (json.status !== "success") {
                const err = new Error(json.message || "unknown error");
                err.fatal = /^unauthorized:/.test(json.message || "");
                throw err;
            }
            return json;
        }

        async function fetchData() {
            if (loading) return;
            loading = true;
            $("syncIcon").classList.add("fa-spin");
            try {
                let json;
                try { json = await callApi(); }
                catch (e) {
                    if (e.fatal) throw e;
                    json = await callApi();   // one retry: a cold cache miss takes ~12–16 s
                }
                data = json;
                fetchedAt = Date.now();
                serverOffset = (json.serverNowMs || fetchedAt) - fetchedAt;
                $("errorBox").classList.add("hidden");
                render();
            } catch (e) {
                showError(e, data);
            } finally {
                loading = false;
                $("syncIcon").classList.remove("fa-spin");
                updateLastUpdated();
            }
        }

        function showError(e, hasData) {
            const box = $("errorBox");
            box.classList.remove("hidden");
            box.innerHTML = e.fatal
                ? `<i class="fa-solid fa-lock"></i> ไม่มีสิทธิ์ดึงข้อมูล: ${escapeHtml(e.message)}`
                : `<i class="fa-solid fa-triangle-exclamation"></i> เชื่อมต่อระบบไม่ได้ (${escapeHtml(e.message)})` +
                  (hasData ? " — แสดงข้อมูลล่าสุดที่โหลดไว้" : " — กดซิงค์เพื่อลองใหม่");
        }

        // Only the open view refreshes, so the awards tab adds no load for staff not using it.
        const refreshCurrent = () => view === "awards" ? loadAwardSummary() : fetchData();
        function scheduleRefresh() {
            setTimeout(async () => {
                if (document.visibilityState === "visible") await refreshCurrent();
                scheduleRefresh();
            }, REFRESH_MS + Math.random() * REFRESH_JITTER_MS);
        }
        $("syncBtn").onclick = refreshCurrent;

        // ── Time & rotation ─────────────────────────────────────────────────
        const nowMs = () => Date.now() + serverOffset;

        function fmtClock(ms) {
            return new Date(ms).toLocaleTimeString("en-GB", { timeZone: "Asia/Bangkok", hour12: false });
        }
        function fmtHm(ms) {
            return new Date(ms).toLocaleTimeString("en-GB", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit" });
        }

        /** {state: 'unknown'|'active'|'changeover'|'done', slot, remainMs} */
        function rotationState() {
            if (slotOverride !== "auto") return { state: "active", slot: Number(slotOverride), manual: true };
            const start = data && data.rotationStartMs;
            if (!start) return { state: "unknown" };
            const elapsed = Math.max(0, nowMs() - start);
            const period = (SLOT_MIN + GAP_MIN) * 60000;
            const slot = Math.floor(elapsed / period);
            const within = elapsed - slot * period;
            if (slot >= SLOTS || (slot === SLOTS - 1 && within >= SLOT_MIN * 60000)) return { state: "done" };
            if (within < SLOT_MIN * 60000) return { state: "active", slot, remainMs: SLOT_MIN * 60000 - within };
            return { state: "changeover", slot: slot + 1, remainMs: period - within };
        }

        const baseFor = (group, slot) => BASES[(GROUPS.indexOf(group) + slot) % 3];

        /** Where a team should be now + next, given the phase. */
        function locationFor(t, rot) {
            if (!data.r1Decided) return { now: TEXT.r1Room, next: null };
            if (data.r2Decided) {
                if (t.r2Passed === true) return { now: TEXT.gameshowFinalist, next: null };
                if (t.r1Passed === true) return { now: TEXT.spotEliminated, next: null };
                return { now: TEXT.activityAfter, next: null };
            }
            if (t.r1Passed === true) return { now: TEXT.spotRoom, next: null };
            const g = t.activityGroup;
            if (!GROUPS.includes(g)) return { now: "ไม่มีกลุ่มกิจกรรม — ติดต่อ IT", next: null };
            if (rot.state === "done") return { now: TEXT.rotationDone, next: null };
            if (rot.state === "unknown") return { now: `เริ่มที่ ${baseFor(g, 0)}`, next: `${baseFor(g, 1)} → ${baseFor(g, 2)}` };
            const nextBase = rot.slot + 1 < SLOTS ? baseFor(g, rot.slot + 1) : "จบเดินฐาน (พักกลางวัน)";
            if (rot.state === "changeover") return { now: `กำลังย้ายไป ${baseFor(g, rot.slot)}`, next: nextBase };
            return { now: baseFor(g, rot.slot), next: nextBase };
        }

        function mmss(ms) {
            const s = Math.max(0, Math.round(ms / 1000));
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        }

        function rotationKey(rot) { return `${rot.state}:${rot.slot ?? ""}`; }

        /** Inverse of baseFor: group in base index b at slot s. */
        const groupInBase = (b, slot) => GROUPS[((b - slot) % 3 + 3) % 3];

        const bangkokDate = ms => new Date(ms).toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });

        /** {lateMin, endMs} when the rotation started > threshold late on the event day, else null. */
        function driftInfo(start, rot) {
            if (!start || rot.manual || (rot.state !== "active" && rot.state !== "changeover")) return null;
            if (bangkokDate(start) !== DRIFT.eventDate) return null;
            const lateMs = start - Date.parse(`${DRIFT.eventDate}T${DRIFT.plannedStart}:00+07:00`);
            if (lateMs <= DRIFT.thresholdMin * 60000) return null;
            // In changeover rot.slot is already the upcoming slot → its end time.
            return { lateMin: Math.round(lateMs / 60000), endMs: start + (rot.slot * (SLOT_MIN + GAP_MIN) + SLOT_MIN) * 60000 };
        }

        /** Wall-clock plan, but only on the event day, and Game Show waits for R2 results. */
        function auditoriumStatus(hm, eventDay, r2Decided) {
            if (!eventDay) return "แผน: " + AUD_PLAN.map(p => `${p.label} ${p.from}`).join(" · ");
            for (const p of AUD_PLAN) {
                if (hm < p.from) return `รอ ${p.label} ${p.from} น.`;
                if (hm < p.to) return p.needsR2 && !r2Decided
                    ? `รอประกาศผลรอบ 2 ก่อนเริ่ม ${p.label}`
                    : `${p.label} กำลังดำเนินการ (ถึง ${p.to})`;
            }
            return "จบกิจกรรมในห้องแล้ว";
        }

        /** Room cards for the pulse widget: [{id, name, floor, status, sub, tappable}]. */
        function roomPulse(rot) {
            const rotating = data.r1Decided && !data.r2Decided && rot.state !== "done";
            const rooms = [{
                id: "lab8", name: TEXT.lab8Room, floor: "", tappable: true, sub: "",
                status: !data.r1Decided ? "รอผลรอบ 1" : data.r2Decided ? "จบ Spot Test แล้ว" : `Spot Test · ${data.counts.r1Passed} ทีม`,
            }];
            BASES.forEach((name, b) => {
                let status, sub = "";
                if (!data.r1Decided) status = "รอผลรอบ 1";
                else if (!rotating) status = "ว่าง — จบเดินฐาน";
                else {
                    const slot = rot.slot ?? 0, g = groupInBase(b, slot);
                    status = rot.state === "active" ? `กลุ่ม ${g} อยู่ในฐาน`
                        : rot.state === "changeover" ? `กลุ่ม ${g} กำลังเดินมา`
                        : `รอเริ่ม — กลุ่ม ${g} เข้าก่อน`;
                    if (rot.state === "active" && slot + 1 < SLOTS) sub = `ถัดไป: กลุ่ม ${groupInBase(b, slot + 1)}`;
                }
                rooms.push({ id: `base${b}`, name, floor: BASE_FLOORS[b], status, sub, tappable: true });
            });
            rooms.push({ id: "aud", name: TEXT.audRoom, floor: "", status: auditoriumStatus(fmtHm(nowMs()), bangkokDate(nowMs()) === DRIFT.eventDate, data.r2Decided), sub: "ตามกำหนดการ", tappable: false });
            return rooms;
        }

        /** Roster filter for a tapped room: teams in it now, or heading to it during changeover. */
        function roomFilter(id, rot) {
            if (id === "lab8") return t => t.r1Passed === true;
            const b = Number(id.slice(4));
            if (!data.r1Decided || data.r2Decided || rot.state === "done") return () => false;
            const g = groupInBase(b, rot.slot ?? 0);
            return t => t.r1Passed !== true && t.activityGroup === g;
        }

        // ── Render ──────────────────────────────────────────────────────────
        function renderBanner(rot) {
            const b = $("phaseBanner");
            let cls, html;
            if (!data.r1Decided) {
                const decided = data.counts.total - data.counts.r1Undecided;
                cls = "bg-amber-50 border-amber-300 text-amber-900";
                html = `<p class="font-bold">🟡 กำลังแข่งขันรอบที่ 1 (MCQ & Unseen)</p>
                        <p class="text-sm">ทุกทีม (${data.counts.total}) อยู่ที่${TEXT.r1Room}` +
                        (decided ? ` · ตัดสินแล้ว ${decided}/${data.counts.total} ทีม (ยังไม่ครบ)` : "") + `</p>`;
            } else if (data.r2Decided) {
                cls = "bg-purple-50 border-purple-300 text-purple-900";
                html = `<p class="font-bold">🏆 ประกาศผลรอบ 2 แล้ว — Game Show</p>
                        <p class="text-sm">${data.counts.r2Passed} ทีมเข้า Game Show · ที่เหลือเป็นผู้ชม / รับเกียรติบัตร</p>`;
            } else if (rot.state === "done") {
                cls = "bg-orange-50 border-orange-300 text-orange-900";
                html = `<p class="font-bold">🍱 พักรับประทานอาหารกลางวัน</p><p class="text-sm">รอประกาศผลรอบ 2 เวลา 13:00 น.</p>`;
            } else {
                cls = "bg-emerald-50 border-emerald-300 text-emerald-900";
                html = `<p class="font-bold">🟢 ประกาศผลรอบ 1 แล้ว — Spot Test + เดินฐาน</p>
                        <p class="text-sm">${data.counts.r1Passed} ทีมสอบ Spot Test · ${data.counts.r1Failed} ทีมเดินฐานกิจกรรม</p>`;
            }
            b.className = `mx-4 mt-3 rounded-xl px-4 py-3 border ${cls}`;
            b.innerHTML = html;
        }

        function renderRotation(rot) {
            const panel = $("rotationPanel");
            const show = data.r1Decided && !data.r2Decided;
            panel.classList.toggle("hidden", !show);
            if (!show) return;
            const start = data.rotationStartMs;
            let status;
            if (rot.manual) status = `<b>บังคับรอบที่ ${rot.slot + 1}</b> (ตั้งเองบนเครื่องนี้ — เปลี่ยนกลับเป็น "อัตโนมัติ" เมื่อ IT เริ่มจับเวลา)`;
            else if (rot.state === "unknown") status = "IT ยังไม่กดเริ่มหมุนฐาน — แสดงฐานแรกของแต่ละกลุ่ม (เลือกรอบเองได้ด้านขวา)";
            else if (rot.state === "done") status = `เดินฐานครบ 3 รอบแล้ว (เริ่ม ${fmtHm(start)} น.)`;
            else if (rot.state === "changeover") status = `<b>เปลี่ยนฐาน → รอบที่ ${rot.slot + 1}</b> · เริ่มในอีก <span class="tabular-nums">${mmss(rot.remainMs)}</span>`;
            else status = `<b>รอบที่ ${rot.slot + 1}/3</b> · เหลือ <span class="tabular-nums">${mmss(rot.remainMs)}</span> นาที (เริ่มหมุนฐาน ${fmtHm(start)} น.)`;
            $("rotationStatus").innerHTML = status;

            $("rotationGrid").innerHTML = GROUPS.map(g => {
                const loc = locationFor({ r1Passed: false, activityGroup: g }, rot);
                return `<div class="rounded-lg card p-2">
                    <div><span class="badge-${g} rounded-full px-2 py-0.5 text-xs font-bold">กลุ่ม ${g}</span></div>
                    <div class="mt-1 font-semibold leading-tight">${escapeHtml(loc.now)}</div>
                    ${loc.next ? `<div class="text-xs muted mt-1">ถัดไป: ${escapeHtml(loc.next)}</div>` : ""}
                </div>`;
            }).join("");
        }

        function renderDrift(rot) {
            const d = driftInfo(data.rotationStartMs, rot);
            $("driftBanner").classList.toggle("hidden", !d);
            if (d) $("driftBanner").textContent =
                `⚠️ กำหนดการเลทกว่าแผนแม่บท ~${d.lateMin} นาที (คาดว่าจะจบฐานรอบนี้เวลา ${fmtHm(d.endMs)})`;
        }

        let lastPulseHtml = "";
        function renderPulse(rot) {
            const html = roomPulse(rot).map(r => {
                const inner = `<div class="font-bold leading-tight">${escapeHtml(r.name)}${r.floor ? ` <span class="muted font-normal text-xs">${escapeHtml(r.floor)}</span>` : ""}</div>
                    <div class="gold font-semibold leading-tight mt-0.5">${escapeHtml(r.status)}</div>
                    ${r.sub ? `<div class="text-xs muted mt-0.5">${escapeHtml(r.sub)}</div>` : ""}`;
                return r.tappable
                    ? `<button data-room="${r.id}" class="text-left rounded-lg card p-2 ${tab === r.id ? "room-active" : ""}">${inner}</button>`
                    : `<div class="rounded-lg card p-2">${inner}</div>`;
            }).join("");
            // Only touch the DOM on change: replacing buttons mid-tap would swallow the click.
            if (html !== lastPulseHtml) { $("roomPulse").innerHTML = html; lastPulseHtml = html; }
        }
        $("roomPulse").onclick = e => {
            const btn = e.target.closest("[data-room]");
            if (!btn || !data) return;
            tab = tab === btn.dataset.room ? "all" : btn.dataset.room;   // tap again = clear
            query = ""; $("search").value = "";
            render();
            $("listNote").scrollIntoView({ behavior: "smooth", block: "start" });
        };

        function renderCounts() {
            const c = data.counts;
            const cell = (label, v) => `<div class="rounded-lg panel py-1.5">
                <div class="text-lg font-bold gold">${v}</div><div class="muted">${label}</div></div>`;
            $("countsBar").innerHTML = cell("ทั้งหมด", c.total) + cell("Spot Test", c.r1Passed) +
                cell("เดินฐาน", c.r1Failed) + cell("Game Show", c.r2Passed);
        }

        const TABS = [
            { id: "all", label: () => `📊 ทั้งหมด (${data.counts.total})`, filter: () => true },
            { id: "A", label: () => `<span class="dot badge-A"></span> กลุ่ม A (${data.counts.groupA})`, filter: t => t.activityGroup === "A" },
            { id: "B", label: () => `<span class="dot badge-B"></span> กลุ่ม B (${data.counts.groupB})`, filter: t => t.activityGroup === "B" },
            { id: "C", label: () => `<span class="dot badge-C"></span> กลุ่ม C (${data.counts.groupC})`, filter: t => t.activityGroup === "C" },
            { id: "spot", label: () => `<span class="dot badge-spot"></span> Spot Test (${data.counts.r1Passed})`, filter: t => t.r1Passed === true },
            { id: "gs", label: () => `<span class="dot badge-gs"></span> Game Show (${data.counts.r2Passed})`, filter: t => t.r2Passed === true },
        ];

        function renderTabs() {
            $("tabs").innerHTML = TABS.map(t =>
                `<button data-tab="${t.id}" class="shrink-0 rounded-full panel px-3 py-1.5 font-semibold ${tab === t.id ? "tab-active" : ""}">${t.label()}</button>`
            ).join("");
        }
        $("tabs").onclick = e => {
            const btn = e.target.closest("[data-tab]");
            if (!btn) return;
            tab = btn.dataset.tab;
            render();   // also clears the room highlight in the pulse widget
        };

        function matches(t, q) {
            return t.teamId.toLowerCase().includes(q) ||
                t.teamName.toLowerCase().includes(q) ||
                t.members.some(m => m.toLowerCase().includes(q));
        }

        function groupBadge(t) {
            if (t.r2Passed === true) return `<span class="rounded-full badge-gs px-2 py-0.5">Game Show</span>`;
            if (t.r1Passed === true) return `<span class="rounded-full badge-spot px-2 py-0.5">Spot Test</span>`;
            if (GROUPS.includes(t.activityGroup)) return `<span class="rounded-full badge-${t.activityGroup} px-2 py-0.5">กลุ่ม ${t.activityGroup}</span>`;
            return `<span class="rounded-full bg-slate-600 text-white px-2 py-0.5">รอผลรอบ 1</span>`;
        }

        function renderCards(rot) {
            const q = query.trim().toLowerCase();
            const activeTab = TABS.find(t => t.id === tab);
            const room = activeTab ? null : roomPulse(rot).find(r => r.id === tab);
            const filter = activeTab ? activeTab.filter : roomFilter(tab, rot);
            const list = q ? data.teams.filter(t => matches(t, q)) : data.teams.filter(filter);
            $("listNote").textContent = q
                ? `ผลการค้นหา "${query.trim()}" ในทุกทีม: ${list.length} ทีม`
                : room ? `ห้อง ${room.name}: ${list.length} ทีม (อยู่ในห้อง / กำลังเดินไป) — แตะห้องอีกครั้งเพื่อดูทั้งหมด`
                : `${list.length} ทีม`;
            $("cards").innerHTML = list.length ? list.map(t => {
                const loc = locationFor(t, rot);
                return `<article class="rounded-xl card px-4 py-3">
                    <div class="flex items-center gap-2">
                        <span class="rounded-full gold-bg text-xs font-bold px-2 py-0.5">${escapeHtml(t.teamId)}</span>
                        <h3 class="font-bold truncate">${escapeHtml(t.teamName) || '<span class="muted">(ไม่มีชื่อทีม)</span>'}</h3>
                    </div>
                    <ol class="mt-1 text-sm muted list-decimal list-inside">
                        ${t.members.map(m => `<li>${escapeHtml(m)}</li>`).join("")}
                    </ol>
                    <div class="mt-2 flex flex-wrap gap-1.5 text-xs font-semibold">
                        ${groupBadge(t)}
                        <span class="rounded-full bg-amber-100 text-slate-950 px-2 py-0.5">📍 ${escapeHtml(loc.now)}</span>
                        ${loc.next ? `<span class="rounded-full panel px-2 py-0.5">➡️ ถัดไป: ${escapeHtml(loc.next)}</span>` : ""}
                    </div>
                </article>`;
            }).join("") : `<p class="text-center muted py-8">ไม่พบทีม</p>`;
        }

        function render() {
            if (!data) return;
            const rot = rotationState();
            lastRotationKey = rotationKey(rot);
            $("slotSelect").value = slotOverride;   // not in the 1 s tick: would fight an open dropdown
            renderDrift(rot);
            renderBanner(rot);
            renderPulse(rot);
            renderRotation(rot);
            renderCounts();
            renderSignSheetPanel();
            renderTabs();
            renderCards(rot);
        }

        $("search").addEventListener("input", e => { query = e.target.value; if (data) renderCards(rotationState()); });
        $("slotSelect").onchange = e => { slotOverride = e.target.value; saveSlotOverride(slotOverride); render(); };

        // ── Spot Test signature sheet (print/PDF + Word .doc) ───────────────
        // Layout follows handbook pp.16-28: A4 portrait, header row repeated, one tbody per
        // team so a team never splits across pages. ลำดับ = member no. within the team.
        const SIGN = {
            title: "ใบลงทะเบียนและเซ็นชื่อผู้เข้าสอบ รอบที่ 2 (Spot Examination) — MedQuiz KKU 2026",
            subtitle: "วันอาทิตย์ที่ 1 พฤศจิกายน 2569 เวลา 10.30 - 12.00 น. ณ ห้องปฏิบัติการ 8 อาคารเรียนรวม ชั้น 4",
            draft: { first40: "ร่าง — ก่อนประกาศผลรอบที่ 1 (ทีมแรก 40 ทีมตามรหัส MQ)", all: "ร่าง — ก่อนประกาศผลรอบที่ 1 (ทุกทีม)" },
        };
        const byTeamId = (a, b) => a.teamId.localeCompare(b.teamId, "en", { numeric: true });

        function signSheetTeams() {
            const sorted = data.teams.slice().sort(byTeamId);
            if (data.r1Decided) return { teams: sorted.filter(t => t.r1Passed === true), draft: "" };
            const scope = $("signSheetScope").value;
            return { teams: scope === "all" ? sorted : sorted.slice(0, 40), draft: SIGN.draft[scope] };
        }

        function renderSignSheetPanel() {
            const undecided = !data.r1Decided;
            $("signSheetScope").classList.toggle("hidden", !undecided);
            const { teams } = signSheetTeams();
            const people = teams.reduce((n, t) => n + Math.max(1, t.members.length), 0);
            $("signSheetNote").textContent = (undecided ? "⏳ ผลรอบ 1 ยังไม่ครบ — พิมพ์เป็นร่างได้ · " : "ทีมผ่านรอบ 1 · ")
                + `${teams.length} ทีม / ${people} แถว`;
            $("signPrintBtn").disabled = $("signDocBtn").disabled = teams.length === 0;
        }
        $("signSheetScope").onchange = () => { if (data) renderSignSheetPanel(); };

        /** Table body: one <tbody> per team; Team ID/Name rowspan = member count (min 1 row). */
        function signSheetRows(teams, forWord) {
            return teams.map(t => {
                const names = t.members.length ? t.members : [""];
                const n = names.length;
                // Word: keep-with-next on every row but the team's last keeps the team on one page.
                const p = (txt, i) => forWord
                    ? `<p class="c"${i < n - 1 ? ' style="page-break-after:avoid"' : ""}>${txt}</p>` : txt;
                return `<tbody class="team">` + names.map((m, i) => `<tr>`
                    + `<td class="c">${p(i + 1, i)}</td>`
                    + (i === 0 ? `<td class="c" rowspan="${n}">${p(escapeHtml(t.teamId), i)}</td>`
                        + `<td class="c" rowspan="${n}">${p(escapeHtml(t.teamName), i)}</td>` : "")
                    + `<td class="c">${p(escapeHtml(m), i)}</td><td>${p("&nbsp;", i)}</td></tr>`).join("") + `</tbody>`;
            }).join("");
        }

        const SIGN_HEAD = `<thead><tr><th style="width:8%">ลำดับ</th><th style="width:11%">Team ID</th>`
            + `<th style="width:23%">Team Name</th><th style="width:33%">ชื่อ - สกุล</th><th style="width:25%">ลายเซ็น</th></tr></thead>`;

        function buildSignSheetPrintHtml(teams, draft) {
            const font = f => new URL(`assets/fonts/${f}`, location.href).href;   // absolute: popup is about:blank
            return `<!doctype html><html lang="th"><head><meta charset="utf-8"><title>ใบเซ็นชื่อ Spot Examination</title><style>
@font-face{font-family:'Sarabun';font-weight:400;src:url('${font("Sarabun-Regular.woff2")}') format('woff2')}
@font-face{font-family:'Sarabun';font-weight:700;src:url('${font("Sarabun-Bold.woff2")}') format('woff2')}
@page{size:A4 portrait;margin:15mm 15mm 15mm 15mm}
body{font-family:'Sarabun',sans-serif;font-size:12pt;color:#000;margin:0}
h1{font-size:13pt;text-align:center;margin:0 0 2pt;text-decoration:underline}
.sub{text-align:center;margin:0 0 4pt}.draft{text-align:center;font-weight:700;margin:0 0 4pt}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #000;padding:2pt 4pt;height:0.9cm;vertical-align:middle}
th{font-weight:700;text-align:center}td.c{text-align:center}
thead{display:table-header-group}tbody.team{break-inside:avoid;page-break-inside:avoid}
</style></head><body><h1>${escapeHtml(SIGN.title)}</h1><p class="sub">${escapeHtml(SIGN.subtitle)}</p>`
                + (draft ? `<p class="draft">${escapeHtml(draft)}</p>` : "")
                + `<table>${SIGN_HEAD}${signSheetRows(teams, false)}</table></body></html>`;
        }

        function buildSignSheetDocHtml(teams, draft) {
            // Word ignores @media print and web fonts: Office namespaces + @page section, per-cell
            // borders, and Thai (complex-script) font set via mso-bidi-* with a fallback stack.
            const ff = `font-family:"TH Sarabun New","Sarabun","TH SarabunPSK","Leelawadee UI",Tahoma,sans-serif;`
                + `mso-bidi-font-family:"TH Sarabun New";font-size:16pt;mso-bidi-font-size:16pt;`;
            const cell = `border:solid windowtext 1.0pt;mso-border-alt:solid windowtext .5pt;padding:0cm 4pt;vertical-align:middle;`;
            return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">`
                + `<head><meta charset="utf-8"><title>ใบเซ็นชื่อ Spot Examination</title>`
                + `<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->`
                + `<style>@page Section1{size:595.3pt 841.9pt;margin:42.5pt 42.5pt 42.5pt 42.5pt;mso-page-orientation:portrait}`
                + `div.Section1{page:Section1}p{margin:0;${ff}}table{border-collapse:collapse;mso-table-layout-alt:fixed}`
                + `td,th{${cell}${ff}height:0.9cm}p.c{text-align:center}th p{text-align:center;font-weight:bold}`
                + `h1{text-align:center;margin:0;font-size:18pt;mso-bidi-font-size:18pt;text-decoration:underline;font-family:"TH Sarabun New","Sarabun",Tahoma,sans-serif;mso-bidi-font-family:"TH Sarabun New"}</style></head>`
                + `<body><div class="Section1"><h1>${escapeHtml(SIGN.title)}</h1><p class="c">${escapeHtml(SIGN.subtitle)}</p>`
                + (draft ? `<p class="c"><b>${escapeHtml(draft)}</b></p>` : "")
                + `<table width="100%" border="1" cellspacing="0" cellpadding="0">`
                + SIGN_HEAD.replace(/<th([^>]*)>([^<]*)<\/th>/g, `<th$1><p>$2</p></th>`)
                    .replace("<tr>", `<tr style="mso-yfti-irow:-1;mso-yfti-firstrow:yes;page-break-inside:avoid">`)
                + signSheetRows(teams, true) + `</table></div></body></html>`;
        }

        $("signPrintBtn").onclick = () => {
            if (!data) return;
            const w = window.open("", "_blank");   // synchronous in the click handler (popup blockers)
            if (!w) {
                $("errorBox").classList.remove("hidden");
                $("errorBox").innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> เบราว์เซอร์บล็อกหน้าต่างพิมพ์ — อนุญาต pop-up แล้วกดพิมพ์อีกครั้ง`;
                return;
            }
            const { teams, draft } = signSheetTeams();
            w.document.open();
            w.document.write(buildSignSheetPrintHtml(teams, draft));
            w.document.close();
            const fonts = w.document.fonts;
            Promise.all([...fonts].map(f => f.load().catch(() => null)))
                .then(() => fonts.ready)
                .then(() => { w.focus(); w.print(); });
        };

        $("signDocBtn").onclick = () => {
            if (!data) return;
            const { teams, draft } = signSheetTeams();
            const blob = new Blob(["﻿" + buildSignSheetDocHtml(teams, draft)], { type: "application/msword" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = draft ? "spot-signsheet-DRAFT.doc" : "spot-signsheet.doc";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        };

        function updateLastUpdated() {
            const [at, src] = view === "awards" ? [awardsAt, awards] : [fetchedAt, data];
            if (!at) { $("lastUpdated").textContent = "ยังไม่ได้โหลดข้อมูล"; return; }
            const min = Math.floor((Date.now() - at) / 60000);
            $("lastUpdated").textContent = `อัปเดตล่าสุด ${min < 1 ? "เมื่อสักครู่" : min + " นาทีที่แล้ว"} (ข้อมูลชีต ${src.generatedAt})`;
        }

        // ── View switch ─────────────────────────────────────────────────────
        function setView(v) {
            view = v === "awards" ? "awards" : "status";
            try { localStorage.setItem("onsiteStaffView", view); } catch { /* private mode */ }
            $("statusView").classList.toggle("hidden", view !== "status");
            $("awardsView").classList.toggle("hidden", view !== "awards");
            $("viewNav").querySelectorAll("[data-view]").forEach(b => b.classList.toggle("tab-active", b.dataset.view === view));
            $("errorBox").classList.add("hidden");
            if (view === "awards") {
                renderAwards();
                if (!awards || Date.now() - awardsAt > REFRESH_MS) loadAwardSummary();
            } else {
                render();
                if (!data || Date.now() - fetchedAt > REFRESH_MS) fetchData();
            }
            updateLastUpdated();
        }
        $("viewNav").onclick = e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); };

        // ── Closing ceremony awards ─────────────────────────────────────────
        // action=getAwardSummary (read-only on the server). The stage checklist keeps
        // only entry ids (teamId / member no.) + ticks in localStorage — no names (PDPA).
        const AWARD_CHECK_KEY = "onsiteAwardChecks_v1";
        let awards = null, awardsAt = 0, awardsLoading = false;
        let awardOrder = "call";
        let checks = (() => { try { return JSON.parse(localStorage.getItem(AWARD_CHECK_KEY)) || {}; } catch { return {}; } })();
        const saveChecks = () => { try { localStorage.setItem(AWARD_CHECK_KEY, JSON.stringify(checks)); } catch { /* private mode */ } };

        async function loadAwardSummary() {
            if (awardsLoading) return;
            awardsLoading = true;
            $("syncIcon").classList.add("fa-spin");
            try {
                let json;
                try { json = await callApi("getAwardSummary"); }
                catch (e) {
                    if (e.fatal) throw e;
                    json = await callApi("getAwardSummary");   // one retry, same as fetchData
                }
                awards = json;
                awardsAt = Date.now();
                $("errorBox").classList.add("hidden");
                renderAwards();
            } catch (e) {
                if (view === "awards") showError(e, awards);
            } finally {
                awardsLoading = false;
                $("syncIcon").classList.remove("fa-spin");
                updateLastUpdated();
            }
        }

        const TIER = {
            gold:   { label: "เหรียญทอง",    icon: "🥇" },
            silver: { label: "เหรียญเงิน",    icon: "🥈" },
            bronze: { label: "เหรียญทองแดง",  icon: "🥉" },
            team:   { label: "Game Show",    icon: "🏆" },
        };
        const PHOTO = {
            bronze: "📸 ถ่ายภาพหมู่ผู้ได้รับเหรียญทองแดง",
            silver: "📸 ถ่ายภาพหมู่ผู้ได้รับเหรียญเงิน",
            gold: "📸 ถ่ายภาพหมู่ผู้ได้รับเหรียญทอง",
            grand: "📸 ชุดที่ 6 — ถ่ายภาพหมู่ทีมที่ได้รับรางวัลทั้งหมด ร่วมกับคณาจารย์และคณะกรรมการจัดงาน",
        };

        /** [{type:'section', tier, heading, items, pending?} | {type:'cue', text}] in rank or stage-call order. */
        function awardSections(order) {
            const ind = awards.individuals, gs = awards.gameshow;
            const hm = gs.filter(g => g.rank >= 4), top3 = gs.filter(g => g.rank <= 3);
            const pending = !awards.isR3Decided;
            if (order === "rank") return [
                { type: "section", tier: "gold", heading: "รางวัลบุคคล คะแนนสูงสุดรอบที่ 1 · เหรียญทอง (อันดับ 1–3)", items: ind.gold },
                { type: "section", tier: "silver", heading: "เหรียญเงิน (อันดับ 4–8)", items: ind.silver },
                { type: "section", tier: "bronze", heading: "เหรียญทองแดง (อันดับ 9–16)", items: ind.bronze },
                { type: "section", tier: "team", heading: "รางวัลการแข่งขันรอบ Game Show (อันดับ 1–8)", items: gs, pending },
            ];
            const rev = a => a.slice().reverse();
            return [
                { type: "section", tier: "bronze", heading: "ชุดที่ 1 · เหรียญทองแดง (8 รางวัล)", items: rev(ind.bronze) },
                { type: "cue", text: PHOTO.bronze },
                { type: "section", tier: "silver", heading: "ชุดที่ 2 · เหรียญเงิน (5 รางวัล)", items: rev(ind.silver) },
                { type: "cue", text: PHOTO.silver },
                { type: "section", tier: "gold", heading: "ชุดที่ 3 · เหรียญทอง (3 รางวัล) + คะแนนสูงสุดรอบที่ 1", items: rev(ind.gold) },
                { type: "cue", text: PHOTO.gold },
                { type: "section", tier: "team", heading: "ชุดที่ 4 · Game Show รางวัลชมเชย (5 ทีม)", items: rev(hm), pending },
                { type: "section", tier: "team", heading: "ชุดที่ 5 · Game Show รองชนะเลิศอันดับ 2 → อันดับ 1 → ชนะเลิศ", items: rev(top3), pending },
                { type: "cue", text: PHOTO.grand },
            ];
        }

        const entryId = (tier, p) => tier === "team" ? `gs:${p.teamId}` : `ind:${p.teamId}:${p.member}`;
        const fmtScore = g => g.score != null ? `${Number(g.score).toFixed(2)}/28` : `raw ${g.raw}`;
        const rankSpan = g => g.from === g.to ? `${g.from}` : `${g.from}–${g.to}`;
        const CUT_LABEL = { 3: "ทอง/เงิน (อันดับ 3/4)", 8: "เงิน/ทองแดง (อันดับ 8/9)", 16: "ทองแดง/ไม่ได้รางวัล (อันดับ 16/17)" };

        /** Equal-score runs from the server (sees rank 17+); older backend → derive from the 16 shown. */
        function tieGroups() {
            if (Array.isArray(awards.tieGroups)) return awards.tieGroups;
            const all = [...awards.individuals.gold, ...awards.individuals.silver, ...awards.individuals.bronze], out = [];
            for (let i = 0; i < all.length;) {
                let j = i;
                while (j + 1 < all.length && all[j + 1].raw === all[i].raw) j++;
                if (j > i) out.push({ from: all[i].rank, to: all[j].rank, count: j - i + 1, raw: all[i].raw, score: all[i].score,
                    cuts: [3, 8].filter(c => c >= all[i].rank && c < all[j].rank) });
                i = j + 1;
            }
            return out;
        }
        const tieOf = rank => tieGroups().find(g => rank >= g.from && rank <= g.to);

        /** Shared by the alert box and the MC script's committee notes. Tiers on screen are NOT changed. */
        function tieNotes() {
            const groups = tieGroups();
            if (!groups.length) return null;
            const straddle = groups.filter(g => g.cuts.length);
            const lines = groups.map(g => `อันดับ ${rankSpan(g)} คะแนนเท่ากัน ${fmtScore(g)} (${g.count} คน)`
                + (g.cuts.length ? ` — คาบเส้น ${g.cuts.map(c => CUT_LABEL[c] || `อันดับ ${c}/${c + 1}`).join(", ")}` : ""));
            const recs = straddle.map(g => g.from === 1
                ? `พิจารณาให้เหรียญทองร่วม ${g.count} เหรียญ และเหรียญเงิน ${Math.max(0, 8 - g.to)} เหรียญ หรือใช้เกณฑ์ตัดสินเสมอด้วยคะแนนทีม`
                : `อันดับ ${rankSpan(g)}: ให้รางวัลระดับเดียวกันทั้ง ${g.count} คน หรือใช้เกณฑ์ตัดสินเสมอด้วยคะแนนทีม`);
            return { straddle: straddle.length > 0, lines, recs };
        }

        function renderTieAlert() {
            const n = tieNotes();
            if (!n) return "";
            const cls = n.straddle ? "bg-amber-50 text-amber-900 border-amber-300" : "bg-white text-slate-700 border-slate-200";
            return `<div class="mx-4 mt-3 rounded-lg border px-3 py-2 text-xs leading-snug ${cls}">
                <div class="font-bold text-sm">${n.straddle ? "⚖️ คะแนนเท่ากันคาบเส้นตัดเหรียญ — กรรมการต้องตัดสินก่อนขึ้นเวที" : "ℹ️ มีผู้ได้คะแนนเท่ากันในกลุ่มผู้ได้รับรางวัล"}</div>
                <ul class="mt-0.5 list-disc list-inside">${n.lines.map(l => `<li>${escapeHtml(l)}</li>`).join("")}</ul>
                ${n.recs.length ? `<div class="mt-1"><b>ข้อเสนอ:</b> ${n.recs.map(escapeHtml).join(" · ")}
                <span class="opacity-75">(รายชื่อด้านล่างยังแบ่ง 3/5/8 เดิม)</span></div>` : ""}
            </div>`;
        }

        const ARROW = " ➔ ", ARROW_HTML = ` <span class="text-slate-400">➔</span> `;
        const scoreText = p => p.score != null ? `${Number(p.score).toFixed(2)}/28` : `raw ${p.raw}`;

        function renderEntry(tier, p) {
            const T = TIER[tier], id = entryId(tier, p), c = checks[id] || {};
            // Bare boxes; column labels (พร้อม / รับ) sit once in the section header.
            const tick = (k, label) => `<label class="w-8 flex justify-center py-0.5 cursor-pointer" title="${label}"><input type="checkbox" class="h-5 w-5 accent-slate-800" aria-label="${label}" data-chk="${escapeHtml(id)}" data-k="${k}" ${c[k] ? "checked" : ""}></label>`;
            const tag = (cls, text) => `<span class="ml-1 whitespace-nowrap rounded border px-1 text-[11px] font-semibold ${cls}">${text}</span>`;
            // Fixed order: MQxxx ➔ team ➔ person(s) ➔ school(s) [• score]
            const mq = `<b class="text-slate-800">${escapeHtml(p.teamId)}</b>`, team = `<span class="text-slate-600">${escapeHtml(p.teamName)}</span>`;
            let body, score = "";
            if (tier === "team") {
                body = [`<span class="font-bold">${escapeHtml(p.title)}</span> ${mq}`, team,
                    `<span class="font-bold">${p.members.map(escapeHtml).join(", ")}</span>`,
                    `<span class="text-slate-600">${escapeHtml(p.schools) || "—"}</span>`].join(ARROW_HTML);
            } else {
                const tie = tieOf(p.rank);
                body = [mq, team,
                    `<span class="font-bold">${escapeHtml(p.name)}</span>${p.isTopScore ? ` <span title="คะแนนสูงสุดรอบที่ 1" aria-label="คะแนนสูงสุดรอบที่ 1">🌟</span>` : ""}`,
                    `<span class="text-slate-600">${escapeHtml(p.school) || "—"}</span>`].join(ARROW_HTML);
                score = ` <span class="whitespace-nowrap">• <b class="tabular-nums">${p.score != null ? `${Number(p.score).toFixed(2)}</b><span class="text-slate-500">/28</span>` : `raw ${escapeHtml(String(p.raw))}</b>`}</span>`
                    + (tie ? tag("bg-amber-50 text-amber-800 border-amber-300", `เสมอ ${rankSpan(tie)}`) : "");
            }
            return `<article class="flex items-start gap-2 pl-3 pr-1 py-1.5 text-sm leading-snug ${c.r ? "award-done" : ""}">
                <span class="w-10 shrink-0 font-bold text-slate-700 whitespace-nowrap">${T.icon}${p.rank}</span>
                <div class="min-w-0 flex-1 break-words">${body}${score}</div>
                <div class="shrink-0 flex">${tick("s", "พร้อมขึ้นเวที")}${tick("r", "รับรางวัลแล้ว")}</div>
            </article>`;
        }

        function renderAwards() {
            document.querySelectorAll("[data-order]").forEach(b => b.classList.toggle("tab-active", b.dataset.order === awardOrder));
            if (!awards) {
                $("awardList").innerHTML = `<p class="text-center muted py-8"><i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลดสรุปรางวัล…</p>`;
                return;
            }
            $("awardBadge").classList.toggle("hidden", !awards.isR3Decided);
            $("awardMeta").textContent = awardOrder === "call"
                ? "ลำดับขึ้นเวที: น้อย → มาก (ทองแดง → เงิน → ทอง → Game Show ชมเชย → อันดับ 3 → 2 → ชนะเลิศ)"
                : "เรียงตามอันดับ: มาก → น้อย";

            const banners = [renderTieAlert()];
            if (!awards.isR3Decided) banners.push(`<div class="mx-4 mt-3 rounded-xl px-4 py-3 bg-amber-400 text-slate-950 font-semibold">⏳ ผล Game Show ยังไม่ครบ (${awards.gameshow.length}/8 ทีม) — รางวัลบุคคลรอบที่ 1 ด้านล่างใช้ได้แล้ว</div>`);
            (awards.warnings || []).forEach(w => banners.push(`<div class="mx-4 mt-3 rounded-xl px-4 py-3 bg-red-100 text-red-900 border border-red-300 font-semibold">⚠️ ${escapeHtml(w)}</div>`));
            $("awardBanners").innerHTML = banners.join("");

            $("awardList").innerHTML = awardSections(awardOrder).map(s => {
                if (s.type === "cue") return `<div class="text-center text-xs font-semibold muted">${escapeHtml(s.text)}</div>`;
                const body = s.items.length ? s.items.map(p => renderEntry(s.tier, p)).join("")
                    : `<p class="px-3 py-2 text-sm text-slate-500">${s.pending ? "รอผล Game Show" : "ยังไม่มีข้อมูล"}</p>`;
                return `<section class="rounded-lg bg-white border border-slate-200 text-slate-900 overflow-hidden">
                    <h2 class="flex items-end gap-2 pl-3 pr-1 py-1.5 text-sm font-bold bg-slate-50 border-b border-slate-200">
                        <span class="flex-1">${TIER[s.tier].icon} ${escapeHtml(s.heading)}</span>
                        ${s.items.length ? `<span class="shrink-0 flex text-[11px] font-semibold text-slate-500"><span class="w-8 text-center">พร้อม</span><span class="w-8 text-center">รับ</span></span>` : ""}</h2>
                    <div class="divide-y divide-slate-200">${body}</div></section>`;
            }).join("");
        }

        $("awardsView").addEventListener("click", e => {
            const b = e.target.closest("[data-order]");
            if (b) { awardOrder = b.dataset.order; renderAwards(); }
        });
        $("awardList").addEventListener("change", e => {
            const el = e.target.closest("[data-chk]");
            if (!el) return;
            const c = checks[el.dataset.chk] || (checks[el.dataset.chk] = {});
            c[el.dataset.k] = el.checked;
            saveChecks();
            el.closest("article").classList.toggle("award-done", !!c.r);
        });
        $("resetChecksBtn").onclick = () => { checks = {}; saveChecks(); renderAwards(); };

        /** Plain Thai text for MC / LINE — stage-call order, one line per recipient. */
        function mcScript() {
            const RULE = "━━━━━━━━━━━━━━━━━━━━";
            const lines = ["🏆 บทประกาศรางวัล MedQuiz KKU 2026", "พิธีปิดและมอบรางวัล · เรียงตามลำดับขึ้นเวที", `ข้อมูล ณ ${awards.generatedAt}`];
            awardSections("call").forEach(s => {
                lines.push("");
                if (s.type === "cue") { lines.push(`>>> ${s.text} <<<`); return; }
                lines.push(RULE, `${TIER[s.tier].icon} ${s.heading}`, RULE);
                if (!s.items.length) { lines.push(s.pending ? "(รอผล Game Show)" : "(ยังไม่มีข้อมูล)"); return; }
                lines.push(s.tier === "team" ? "🎤 ขอเชิญทีมต่อไปนี้ขึ้นรับรางวัลบนเวที" : `🎤 ขอเชิญผู้ได้รับ${TIER[s.tier].label}ขึ้นรับรางวัลบนเวที`);
                // One line per recipient, fixed field order (same as the on-screen list).
                s.items.forEach((p, i) => {
                    lines.push("");
                    lines.push(s.tier === "team"
                        ? `${i + 1}) ${p.title} (อันดับ ${p.rank}) ${p.teamId}${ARROW}${p.teamName}${ARROW}${p.members.join(", ")}${ARROW}${p.schools || "—"}`
                        : `${i + 1}) ${p.teamId}${ARROW}${p.teamName}${ARROW}${p.name}${p.isTopScore ? " 🌟 คะแนนสูงสุดรอบที่ 1" : ""}${ARROW}${p.school || "—"} • ${scoreText(p)}`);
                });
            });
            const n = tieNotes();
            lines.push("", RULE, "📝 บันทึกสำหรับกรรมการ / ทีมงาน (ไม่ต้องประกาศ)", RULE);
            if (!n) lines.push("ไม่มีผู้ได้คะแนนเท่ากันในกลุ่มผู้ได้รับรางวัลบุคคล");
            else {
                lines.push("คะแนนเท่ากัน (เต็ม 28):", ...n.lines.map(l => "• " + l));
                if (n.recs.length) lines.push("ข้อเสนอ:", ...n.recs.map(r => "• " + r), "• รายชื่อด้านบนยังแบ่งตามระบบ 3/5/8 เดิม — ปรับตามมติกรรมการก่อนประกาศ");
            }
            (awards.warnings || []).forEach(w => lines.push("⚠️ " + w));
            return lines.join("\n");
        }

        $("copyScriptBtn").onclick = async () => {
            if (!awards) return;
            const text = mcScript(), btn = $("copyScriptBtn"), orig = "📋 คัดลอกบทประกาศพิธีกร";
            let ok = false;
            try { await navigator.clipboard.writeText(text); ok = true; }
            catch {
                const ta = document.createElement("textarea");   // fallback: older in-app browsers (LINE)
                ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
                document.body.appendChild(ta); ta.select();
                try { ok = document.execCommand("copy"); } catch { ok = false; }
                ta.remove();
            }
            btn.textContent = ok ? "✅ คัดลอกแล้ว" : "❌ คัดลอกไม่ได้";
            setTimeout(() => { btn.textContent = orig; }, 2000);
        };

        // 1 s tick: clock + countdown; full re-render only when the rotation slot/state flips.
        setInterval(() => {
            $("clock").textContent = fmtClock(nowMs());
            updateLastUpdated();
            if (!data) return;
            const rot = rotationState();
            if (rotationKey(rot) !== lastRotationKey) render();
            else { renderRotation(rot); renderPulse(rot); }   // pulse: auditorium follows wall clock
        }, 1000);
    </script>
</body>

</html>
