<!-- ระบบตรวจ SAQ รอบ 0 (ขั้นที่ 4 — กรรมการตัดสินคลัสเตอร์คำตอบ) -->

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจ SAQ รอบ 0 — MedQuiz KKU 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: #f8faff;
            color: #1e293b;
        }

        .nav-gradient {
            background: linear-gradient(to right, #0f1f4b, #1e3a8a);
        }

        .answer-box {
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* แถบอ้างอิงเฉลย + ตัวกรอง ต้องติดอยู่บนจอตลอดระหว่างไล่ตรวจ */
        .sticky-head {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #f8faff;
        }

        #itemTabs::-webkit-scrollbar {
            height: 6px;
        }

        #itemTabs::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <nav class="nav-gradient text-white p-4 shadow-lg">
        <div class="max-w-[1200px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-arrow-left"></i></a>
                <i class="fa-solid fa-list-check text-yellow-400"></i>
                <span class="font-bold tracking-tight">ตรวจ SAQ รอบ 0</span>
                <span class="text-[11px] bg-white/10 border border-white/20 rounded-full px-2 py-0.5">
                    กรรมการตัดสินคลัสเตอร์ที่ AI ไม่ชัดเจน
                </span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="saqReloadItem()"
                    class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg text-xs transition-all font-bold border border-white/10">
                    <i class="fa-solid fa-rotate"></i> โหลดใหม่
                </button>
                <div class="text-right hidden sm:block">
                    <p class="text-[10px] opacity-60 leading-none">ผู้ตรวจ,</p>
                    <p class="text-xs font-bold" id="staffName">Staff</p>
                </div>
                <button onclick="handleLogout()"
                    class="bg-red-500/20 hover:bg-red-500 text-red-200 hover:text-white px-3 py-1.5 rounded-lg text-xs transition-all font-bold">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="grow max-w-[1200px] w-full mx-auto px-4 pb-28">

        <!-- แท็บเลือกข้อ + ตัวนับความคืบหน้า -->
        <div id="itemTabs" class="flex gap-2 overflow-x-auto py-3"></div>

        <!-- แถบอ้างอิงเฉลย (ปักไว้บนสุด) + ตัวกรอง -->
        <div class="sticky-head pt-1 pb-3">
            <div id="refBox" class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 shadow-sm"></div>
            <div id="filterBar" class="flex flex-wrap gap-2 mt-3"></div>
            <p class="text-[11px] text-slate-400 mt-2">
                คีย์ลัด: <b>1</b> ถูก · <b>2</b> ผิด · <b>3</b> ไม่แน่ใจ · <b>↑ ↓ ← →</b> เลื่อนการ์ด ·
                คลิกการ์ดเพื่อเลือกก่อนกดคีย์ลัด
            </p>
        </div>

        <!-- รายการคลัสเตอร์ -->
        <div id="cardList"></div>
    </main>

    <!-- แถบสรุป + ปุ่มยืนยันทั้งข้อ -->
    <div id="statusBar"
        class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-2px_10px_rgba(0,0,0,.05)] px-4 py-3">
    </div>

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

    <script type="module">
        // auth.js มี onAuthStateChanged ข้างใน — แค่ import ก็เด้งไป login.html
        // ถ้ายังไม่ได้ล็อกอิน ซึ่งเป็นพฤติกรรมที่ต้องการของหน้านี้
        import { logout } from '../js/auth.js';
        import { auth } from '../js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { initSaqGrading, saqReload } from '../js/saq-grading-logic.js';

        window.handleLogout = () => { if (confirm('ยืนยันการออกจากระบบ?')) logout(); };
        window.saqReloadItem = () => saqReload();

        let started = false;
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('staffName').textContent = user.displayName || user.email;
            if (started) return;      // token refresh ไม่ต้องโหลดซ้ำ
            started = true;
            initSaqGrading({
                getIdToken: async () => auth.currentUser ? await auth.currentUser.getIdToken() : '',
            });
        });
    </script>
</body>

</html>
