<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 Spot Grading — MedQuiz KKU 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f8faff; color: #1e293b; }
        .nav-gradient { background: linear-gradient(to right, #0f1f4b, #1e3a8a); }
        button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
    </style>
</head>

<body class="min-h-screen">
    <nav class="nav-gradient text-white p-4 shadow-lg">
        <div class="max-w-[1100px] mx-auto flex items-center gap-3">
            <a href="../index.html" class="opacity-70 hover:opacity-100">&larr;</a>
            <span class="font-bold">R2 Spot Grading</span>
            <span id="pending" class="ml-auto text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-800">ส่งครบแล้ว</span>
            <span id="staffName" class="text-xs opacity-80"></span>
        </div>
    </nav>

    <div id="fixtureBanner" hidden class="bg-amber-100 text-amber-900 text-center text-sm py-1">
        FIXTURE MODE — ข้อมูลปลอม ไม่เชื่อมต่อ Firebase
    </div>

    <main id="app" hidden class="max-w-[1100px] mx-auto p-4 space-y-4">

        <section class="bg-white border border-slate-200 rounded-xl p-4">
            <h2 class="font-bold mb-2">1. เลือกข้อ</h2>
            <div id="picker" class="grid grid-cols-7 sm:grid-cols-10 gap-1"></div>
            <div class="flex items-center gap-3 mt-3">
                <div id="lockBar" class="text-sm text-slate-500">เลือกข้อที่จะตรวจ</div>
                <button id="takeover" hidden class="text-xs bg-amber-600 text-white rounded px-3 py-1">ตรวจแทน</button>
            </div>
        </section>

        <section class="bg-slate-900 text-white rounded-xl p-4 sticky top-0 z-10">
            <div class="flex items-baseline gap-3 flex-wrap">
                <span id="qNo" class="text-2xl font-bold">-</span>
                <span id="qSubject" class="text-sm opacity-80"></span>
            </div>
            <div class="mt-1 text-xs opacity-70">เฉลย</div>
            <div id="qKey" class="text-xl font-bold whitespace-pre-wrap break-words">-</div>
            <div id="qRubric" class="text-sm opacity-90 whitespace-pre-wrap break-words mt-1"></div>
        </section>

        <section class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">
            <h2 class="font-bold">2. ให้คะแนน</h2>
            <div class="flex items-center gap-2 flex-wrap">
                <input id="team" type="text" inputmode="text" autocomplete="off" autofocus disabled list="teamList"
                    placeholder="เลขทีม เช่น 15 / 015 / MQ015 (เลขหลักเดียวกด Enter)"
                    class="border border-slate-300 rounded-lg px-3 py-2 text-lg w-72">
                <datalist id="teamList"></datalist>
                <button id="btn0" disabled class="bg-red-600 text-white rounded-lg px-6 py-3 text-lg font-bold">0 ผิด</button>
                <button id="btn1" disabled class="bg-emerald-600 text-white rounded-lg px-6 py-3 text-lg font-bold">1 ถูก</button>
            </div>
            <div id="teamPreview" class="text-xl font-bold text-slate-800 min-h-[1.75rem]"></div>
            <div id="teamErr" class="text-sm text-red-600 font-bold"></div>
            <div id="armed" class="text-sm text-blue-700 font-bold"></div>
            <div id="graded" hidden class="flex items-center gap-3 flex-wrap bg-orange-100 border-2 border-orange-500 text-orange-900 rounded-lg px-4 py-3">
                <span id="gradedText" class="font-bold text-lg"></span>
                <button id="unlock" hidden class="bg-orange-600 text-white rounded-lg px-4 py-2 text-sm font-bold">🔓 ยืนยันแก้ไขคะแนนเดิม</button>
            </div>
            <div id="last" hidden class="flex items-center gap-2 text-sm bg-slate-100 rounded-lg px-3 py-2">
                <span>ล่าสุด:</span><span id="lastText" class="font-bold"></span>
                <button id="undo" class="ml-auto text-xs bg-slate-700 text-white rounded px-3 py-1">ย้อนกลับ</button>
            </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-xl p-4">
            <div class="flex items-baseline gap-3 mb-2">
                <h2 class="font-bold">3. สถานะรายทีม</h2>
                <span id="stripSum" class="text-xs text-slate-500"></span>
            </div>
            <div id="strip" class="grid grid-cols-8 sm:grid-cols-10 gap-1"></div>
            <p class="text-xs text-slate-500 mt-2">เขียว = 1, แดง = 0, เทา = ยังไม่ตรวจ — คลิกช่องเพื่อแก้คะแนนทีมนั้น</p>
        </section>
    </main>

    <div id="toast" hidden></div>

    <script type="module">
        import { initGraderPage } from '../js/spot-grading-app.js';

        const fixture = new URLSearchParams(location.search).get('fixture') === '1';
        const show = () => { document.getElementById('app').hidden = false; };

        if (fixture) {
            // ข้อมูลปลอมล้วน ไม่แตะ Firebase
            initGraderPage({ fixture: true }).then(show);
        } else {
            const { auth } = await import('../js/firebase-config.js');
            const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
            const { requireStaff } = await import('../js/staff-guard.js');
            let started = false;
            onAuthStateChanged(auth, async (user) => {
                if (!(await requireStaff(user))) return;
                document.getElementById('staffName').textContent = user.displayName || user.email;
                if (started) return;      // token refresh ไม่ต้องโหลดซ้ำ
                started = true;
                await initGraderPage({ fixture: false, user });
                show();
            });
        }
    </script>
</body>

</html>
